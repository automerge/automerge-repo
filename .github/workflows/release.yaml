name: Publish release

on:
  # Tags created with GITHUB_TOKEN do not emit a second workflow event, so the
  # create-release-tag workflow dispatches this workflow explicitly.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing v-prefixed tag to publish
        required: true
        type: string
  # Keep the tag trigger so tags pushed by a maintainer are handled too.
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify package versions
        shell: bash
        run: |
          set -euo pipefail

          node scripts/version.mjs check --tag "$RELEASE_TAG"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail

          publish_args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            publish_args+=(--tag next)
          fi

          pnpm -r publish --no-git-checks "${publish_args[@]}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists"
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
